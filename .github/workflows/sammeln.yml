name: Wetterdaten sammeln

# Ein Durchlauf fragt die Station knapp 6 Stunden lang alle 5 Minuten ab und startet sich
# danach selbst neu. GitHub-Zeitpläne laufen oft stark verspätet; der stündliche Zeitplan
# dient nur als Reserve, falls die Kette einmal abreisst. Dank "concurrency" läuft nie mehr
# als ein Durchlauf gleichzeitig.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:          # manuell starten: Actions -> Wetterdaten sammeln -> Run workflow

permissions:
  contents: write
  actions: write              # zum Neustarten am Ende

concurrency:
  group: wetterdaten
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Datenzweig "daten" holen
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          mkdir daten && cd daten
          git init -q
          git remote add origin "$REPO_URL"
          if git ls-remote --exit-code origin daten >/dev/null; then
            git fetch -q --depth=1 origin daten
            git checkout -q -b daten FETCH_HEAD
          else
            git checkout -q --orphan daten
          fi

      - name: Station alle 5 Minuten abfragen
        run: |
          ende=$(( $(date +%s) + 330 * 60 ))
          while :; do
            # Neuesten Stand holen (z.B. nach einem Import älterer Daten)
            (cd daten && git fetch -q --depth=1 origin daten && git reset -q --hard FETCH_HEAD) || true
            python3 collect.py --data daten/data || true
            (
              cd daten
              git add -A data
              if ! git diff --cached --quiet; then
                git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -q -m "Messwerte $(date -u +'%Y-%m-%d %H:%M') UTC"
                git push -q origin daten || echo "Push fehlgeschlagen, nächster Versuch beim nächsten Abruf"
              fi
            )
            [ $(( $(date +%s) + 300 )) -ge "$ende" ] && break
            sleep 300
          done

      - name: Nächsten Durchlauf starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sammeln.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"
